<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>원소 실험실 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1120;color:#e0e7ef;font-family:'Noto Sans KR',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);flex-shrink:0}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);display:grid;place-items:center;font:700 14px 'JetBrains Mono';color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.left{flex:0 0 56%;padding:6px;display:flex;flex-direction:column;overflow-y:auto}
.right{flex:1;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.06);overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.legend span{font-size:7px;padding:1px 4px;border-radius:3px}
.ptable{display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(10,auto);gap:1.5px;user-select:none;flex-shrink:0}
.el{border-radius:3px;padding:1px;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:30px;transition:all .1s;border:1px solid transparent}
.el:hover{transform:scale(1.12);z-index:10;filter:brightness(1.3)}
.el .z{font-size:5.5px;opacity:.6;line-height:1}
.el .sym{font-size:11px;font-weight:700;line-height:1;font-family:'JetBrains Mono'}
.el .nm{font-size:5px;opacity:.7;line-height:1}
.hovinfo{margin-top:4px;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.04);font-size:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:20px;flex-shrink:0}
.ctrls{margin-top:4px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);flex-shrink:0}
.ctrls .row{display:flex;gap:12px}
.ctrls .col{flex:1}
.ctrls label{font-size:8px;color:#8899aa}
.ctrls .v{font-size:9px;font-weight:600;font-family:'JetBrains Mono'}
.ctrls input[type=range]{width:100%;height:16px}
.lab{flex:1;padding:8px;overflow-y:auto;position:relative;background:radial-gradient(ellipse at 50% 20%,rgba(0,210,255,.04),transparent 70%)}
.lab-title{font-size:10px;font-weight:600;color:#6b7a8d;margin-bottom:4px}
.lab-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#2a3a4d;font-size:11px}
.lab-items{display:flex;flex-wrap:wrap;gap:5px}
.lab-card{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;position:relative;min-width:90px;transition:all .15s}
.lab-card:hover{background:rgba(255,255,255,.07)}
.lab-card.sel{background:linear-gradient(135deg,rgba(0,210,255,.12),rgba(58,123,213,.08));border-color:rgba(0,210,255,.5)}
.lab-card .f{font:700 15px 'JetBrains Mono';color:#e0e7ef}
.lab-card .n{font-size:8px;color:#8899aa;margin-top:1px}
.lab-card .ph{margin-top:3px;font-size:10px;font-weight:600}
.lab-card .x{position:absolute;top:2px;right:5px;background:none;border:none;color:#555;cursor:pointer;font-size:11px}
.dragover{outline:2px dashed rgba(0,210,255,.5);outline-offset:-2px;background:rgba(0,210,255,.05)!important}
.detail{border-top:1px solid rgba(255,255,255,.06);padding:10px 12px;overflow-y:auto;background:rgba(0,0,0,.25);flex-shrink:0;max-height:50%}
.detail-header{font:700 14px 'JetBrains Mono';margin-bottom:4px;display:flex;align-items:baseline;gap:8px}
.detail-header .sub{font:400 10px 'Noto Sans KR';color:#8899aa}
.detail-desc{font-size:10px;color:#94a3b8;line-height:1.6;margin-bottom:8px;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:6px;border-left:3px solid #3a7bd5}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.detail-grid .cell{padding:5px 7px;border-radius:6px;background:rgba(255,255,255,.03)}
.detail-grid .cell .lbl{font-size:7px;color:#5a6a7d;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.detail-grid .cell .val{font-size:10px;color:#c8d6e5;font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:1000}
.modal{background:#1a2233;border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:340px;width:90%;max-height:70vh;overflow-y:auto}
.modal h3{font-size:13px;margin-bottom:2px}
.modal .sub{font-size:10px;color:#6b7a8d;margin-bottom:10px}
.modal button{display:block;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 12px;cursor:pointer;color:#e0e7ef;text-align:left;margin-bottom:5px;transition:background .15s}
.modal button:hover{background:rgba(0,210,255,.12)}
.modal button .bf{font:700 13px 'JetBrains Mono'}
.modal button .bd{font-size:9px;color:#8899aa;margin-top:1px}
@media(max-width:900px){.main{flex-direction:column}.left{flex:none;max-height:55vh;overflow-y:auto}.right{flex:1;min-height:200px}}
</style>
</head>
<body>
<header>
<div class="logo">Pt</div>
<div><div style="font-size:14px;font-weight:700">원소 실험실</div><div style="font-size:9px;color:#6b7a8d">118원소 · 130+화합물 · 온도/기압 시뮬레이션</div></div>

<div class="main">
<div class="left">

<div class="col"><div style="display:flex;justify-content:space-between"><label>🔬 기압</label><span class="v" id="pv"></span></div><input type="range" id="ps" min="1" max="10000" value="100" style="accent-color:#00d2ff"><div style="display:flex;justify-content:space-between;font-size:7px;color:#4a5568"><span>0.01 atm</span><span>100 atm</span></div></div>
</div></div>
</div>
<div class="right">
<div class="lab" id="labzone">
<div class="lab-title">🧪 실험실 <span style="font-size:7px;font-weight:400;margin-left:auto;float:right">드래그→놓기 | 물질위 드롭→결합</span></div>
<div class="lab-empty" id="labe"><div style="font-size:36px;opacity:.3">⚗️</div><div>주기율표에서 원소를 끌어다 놓으세요</div></div>
<div class="lab-items" id="labi"></div>
</div>
<div class="detail" id="det" style="display:none"></div>
</div>
</div>
<div id="mc"></div>

// Build compound map
const CM={};Object.keys(MD).forEach(k=>{const mol=MD[k];if(!mol||!mol.elements)return;const key=[...new Set(mol.elements)].sort().join("+");if(!CM[key])CM[key]=[];if(!CM[key].includes(k))CM[key].push(k);});
function findCompounds(els){const u=[...new Set(els)].sort();const r=[...(CM[u.join("+")]||[])];if(u.length>=3)for(let i=0;i<u.length;i++){const sub=u.filter((_,j)=>j!==i).join("+");(CM[sub]||[]).forEach(f=>{if(!r.includes(f))r.push(f);});}if(u.length>=4)for(let i=0;i<u.length;i++)for(let j=i+1;j<u.length;j++){const sub=u.filter((_,k2)=>k2!==i&&k2!==j).join("+");(CM[sub]||[]).forEach(f=>{if(!r.includes(f))r.push(f);});}return r;}
function getPhase(mol,T,P){if(!mol)return"알 수 없음";const{mp,bp}=mol;if(mp===null&&bp===null)return mol.state25||"알 수 없음";const bA=bp!==null?bp+(P-1)*30:null;const mA=mp!==null?mp+(P-1)*0.5:null;if(mA!==null&&T<mA)return"고체 ❄️";if(bA!==null&&T>=bA)return"기체 💨";if(mA!==null&&bA!==null&&T>=mA&&T<bA)return"액체 💧";if(mA!==null&&T>=mA)return"액체 💧";if(bA!==null&&T<bA)return"고체 ❄️";return mol.state25||"알 수 없음";}

  EL.forEach(e=>{const c=CC[e.c]||{b:'#333',t:'#ccc'};h+='<div class="el" style="grid-column:'+e.col+';grid-row:'+e.row+';background:'+c.b+'cc;color:'+c.t+'" draggable="true" data-s="'+e.s+'" onmouseenter="SI(\''+e.s+'\')" onmouseleave="HI()"><span class="z">'+e.z+'</span><span class="sym">'+e.s+'</span><span class="nm">'+e.n+'</span></div>';});
  h+='<div style="grid-column:1/3;grid-row:9;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-size:7px;color:#b08968;opacity:.5">란타넘족</div>';
  h+='<div style="grid-column:1/3;grid-row:10;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-size:7px;color:#6d6875;opacity:.5">악티늄족</div>';
  document.getElementById('pt').innerHTML=h;
  document.getElementById('pt').querySelectorAll('.el').forEach(d=>{d.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',d.dataset.s);});});
  // Lab drop zone
  const lz=document.getElementById('labzone');
  lz.addEventListener('dragover',e=>e.preventDefault());
  lz.addEventListener('drop',e=>{e.preventDefault();const s=e.dataTransfer.getData('text/plain');if(s)drop(s);});
  // Sliders
  document.getElementById('ts').addEventListener('input',e=>{T=+e.target.value;UC();RL();RD();});
  document.getElementById('ps').addEventListener('input',e=>{P=+e.target.value/100;UC();RL();RD();});
  UC();
}
function SI(s){const el=EL.find(e=>e.s===s);if(!el)return;const c=CC[el.c];document.getElementById('hov').innerHTML='<b style="font-family:JetBrains Mono">'+el.s+'</b> <span>'+el.n+'('+el.e+')</span> <span style="color:#6b7a8d">Z='+el.z+' M='+el.m+(el.en?' EN='+el.en:'')+'</span>'+(c?'<span style="padding:0 4px;border-radius:3px;font-size:7px;background:'+c.b+';color:'+c.t+'">'+c.l+'</span>':'');}
function HI(){document.getElementById('hov').innerHTML='&nbsp;';}
function UC(){document.getElementById('tv').textContent=T+'°C ('+(T+273.15).toFixed(1)+'K)';document.getElementById('tv').style.color=T>1000?'#ff6b6b':T<-100?'#74c0fc':'#e0e7ef';document.getElementById('pv').textContent=P.toFixed(2)+' atm';document.getElementById('hdr').textContent='🌡️'+T+'°C 🔬'+P.toFixed(2)+'atm';}
function RL(){
  const c=document.getElementById('labi');
  document.getElementById('labe').style.display=lab.length?'none':'block';
  c.innerHTML=lab.map(it=>{
    const ph=it.mol?getPhase(it.mol,T,P):'알 수 없음';
    const pc=ph.includes('기체')?'#74c0fc':ph.includes('액체')?'#69db7c':ph.includes('고체')?'#ffa94d':'#888';
    const sl=selId===it.id?' sel':'';
    return '<div class="lab-card'+sl+'" onclick="SEL('+it.id+')" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="CMB(event,'+it.id+')"><button class="x" onclick="event.stopPropagation();REM('+it.id+')">✕</button><div class="f">'+(it.mol?it.mol.formula:it.formula)+'</div>'+(it.mol?'<div class="n">'+it.mol.name+'</div>':'')+'<div class="ph" style="color:'+pc+'">'+ph+'</div></div>';
  }).join('');
}
function RD(){
  const det=document.getElementById('det');
  if(!selId){det.style.display='none';return;}
  const it=lab.find(i=>i.id===selId);
  if(!it||!it.mol){det.style.display='none';return;}
  const m=it.mol;det.style.display='block';
  const ph=getPhase(m,T,P);
  const pairs=[
    ['분자량',m.molarMass+' g/mol'],['현재 상태 ('+T+'°C, '+P.toFixed(2)+'atm)',ph],
    ['녹는점 (mp)',m.mp!==null?m.mp+'°C':'해당 없음'],['끓는점 (bp)',m.bp!==null?m.bp+'°C':'해당 없음 (분해)'],
    ['극성',m.polarity],['색상',m.color],['결합 유형',m.bondType],['분자 구조 / 기하',m.shape],
    ['물과의 반응',m.waterReact],['불과의 반응',m.fireReact],
    ['구성 원소',m.elements.join(', ')],['영문명',m.nameEn]
  ];
  det.innerHTML='<div class="detail-header">'+m.formula+'<span class="sub">'+m.name+' ('+m.nameEn+')</span></div><div class="detail-desc">'+m.description+'</div><div class="detail-grid">'+pairs.map(p=>'<div class="cell"><div class="lbl">'+p[0]+'</div><div class="val">'+p[1]+'</div></div>').join('')+'</div>';
}
function SEL(id){selId=selId===id?null:id;RL();RD();}
function REM(id){lab=lab.filter(i=>i.id!==id);if(selId===id)selId=null;RL();RD();}
function drop(sym){const fs=EF[sym]||[{f:sym,n:sym,d:''}];if(fs.length>1)SFP(sym,fs);else ADD(fs[0].f);}
function ADD(k){const mol=MD[k]||null;lab.push({id:nid++,formula:k,mol});RL();CM2();}
function CMB(ev,tid){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('dragover');const sym=ev.dataTransfer.getData('text/plain');if(!sym)return;const t=lab.find(i=>i.id===tid);if(!t)return;const tE=t.mol?t.mol.elements:[t.formula];
// Check if either element has ion states
const dropIon=ION[sym];const targSym=(tE.length===1)?tE[0]:null;const targIon=targSym?ION[targSym]:null;
if(dropIon&&dropIon.length>1){showIonPicker(sym,dropIon,tid,tE);return;}
if(targIon&&targIon.length>1&&tE.length===1){showIonPicker(targSym,targIon,tid,tE,sym);return;}
// Normal: find compounds
const cs=findCompounds([...tE,sym]);if(cs.length>1)SCP(cs,tid);else if(cs.length===1){const idx=lab.findIndex(i=>i.id===tid);lab[idx]={id:tid,formula:cs[0],mol:MD[cs[0]]||null};selId=tid;RL();RD();}else drop(sym);}
function SFP(sym,forms){document.getElementById('mc').innerHTML='<div class="modal-bg" onclick="CM2()"><div class="modal" onclick="event.stopPropagation()"><h3>'+sym+' 형태 선택</h3><div class="sub">동소체 또는 분자 형태를 선택하세요</div>'+forms.map(f=>'<button onclick="ADD(\''+f.f+'\')"><div class="bf">'+f.f+'</div><div class="bd">'+f.n+' — '+f.d+'</div></button>').join('')+'</div></div>';}
function SCP(cs,tid){document.getElementById('mc').innerHTML='<div class="modal-bg" onclick="CM2()"><div class="modal" onclick="event.stopPropagation()"><h3>생성할 화합물 선택</h3><div class="sub">'+cs.length+'개 가능</div>'+cs.map(f=>{const mol=MD[f];return'<button onclick="SC(\''+f+'\','+tid+')"><div class="bf">'+(mol?mol.formula:f)+'</div>'+(mol?'<div class="bd">'+mol.name+' — '+mol.bondType+'</div>':'')+'</button>';}).join('')+'</div></div>';}
function SC(f,tid){const idx=lab.findIndex(i=>i.id===tid);if(idx>=0){lab[idx]={id:tid,formula:f,mol:MD[f]||null};selId=tid;}CM2();RL();RD();}
function showIonPicker(ionSym,ions,tid,tE,otherSym){
var otherEls=otherSym?[otherSym]:tE.filter(function(e){return e!==ionSym;});
var h='<div class="modal-bg" onclick="CM2()"><div class="modal" onclick="event.stopPropagation()"><h3>'+ionSym+' 이온화 상태 선택</h3><div class="sub">결합 시 '+ionSym+'의 산화수를 선택하세요</div>';
ions.forEach(function(ion){
  var compId=null;
  // Try to find matching compound
  otherEls.forEach(function(oe){var key=ionSym+ion.ox+"+"+oe;if(IC[key]&&MD[IC[key]])compId=IC[key];});
  var mol=compId?MD[compId]:null;
  var dis=mol?'':'style="opacity:0.35;pointer-events:none"';
  h+='<button onclick="applyIon(&quot;'+(compId||'')+'&quot;,'+tid+')" '+dis+'><div class="bf">'+ion.ion+(mol?' \u2192 '+mol.formula:'')+'</div><div class="bd">'+(mol?mol.name:'해당 조합의 화합물 데이터 없음')+'</div></button>';
});
h+='</div></div>';
document.getElementById('mc').innerHTML=h;
}
function applyIon(compId,tid){
if(!compId||!MD[compId]){CM2();return;}
var idx=lab.findIndex(function(i){return i.id===tid;});
if(idx>=0){lab[idx]={id:tid,formula:compId,mol:MD[compId]};selId=tid;}
CM2();RL();RD();
}
function CM2(){document.getElementById('mc').innerHTML='';}
init();
</script>
</body>
</html>
